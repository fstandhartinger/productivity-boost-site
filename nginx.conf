server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  absolute_redirect off;
  port_in_redirect off;
  gzip on; gzip_comp_level 6; gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-cwLNZuB5ztcK0HIHZoAHqIhY7BorlcrQ7BBGP1Xt24M='; style-src 'self' 'sha256-XGlFvHFflfLAtGEo7XyHzyB2aWdXyoYovjPH+96hJsg='; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
  # preview host: keep it out of search engines until the real domain goes live
  set $robots "";
  if ($host ~* "mintapis\.com$") { set $robots "noindex, nofollow"; }
  add_header X-Robots-Tag $robots always;
  location = /robots.txt { default_type text/plain; if ($host ~* "mintapis\.com$") { return 200 "User-agent: *\nDisallow: /\n"; } try_files /robots.txt =404; }
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location ~* \.(woff2|avif|webp|png|jpg|svg|mp4|webm)$ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; add_header X-Robots-Tag $robots always; try_files $uri =404; }
  location ~* \.(js|json)$ { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff always; add_header X-Robots-Tag $robots always; try_files $uri =404; }
  location / { add_header Cache-Control "public, max-age=300"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-cwLNZuB5ztcK0HIHZoAHqIhY7BorlcrQ7BBGP1Xt24M='; style-src 'self' 'sha256-XGlFvHFflfLAtGEo7XyHzyB2aWdXyoYovjPH+96hJsg='; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always; add_header X-Robots-Tag $robots always; try_files $uri $uri/ =404; }
  error_page 404 /404.html;
}
