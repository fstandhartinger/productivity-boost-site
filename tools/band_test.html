<!doctype html><meta charset="utf-8"><body style="margin:0;background:#08090D">
<canvas id="c1" width="640" height="480"></canvas>
<canvas id="c2" width="330" height="260" style="margin-left:20px"></canvas>
<script type="module">
import {spectra, paintRows} from '../src/js/band.js';
const band = await (await fetch('../src/data/band.json')).json();
for (const [id,w,h] of [['c1',640,480],['c2',330,260]]) {
  const c=document.getElementById(id), ctx=c.getContext('2d');
  const sp=spectra(band,w);
  paintRows(ctx,sp,{w,h},0,sp.rows.length);
}
document.title='done';
</script>
